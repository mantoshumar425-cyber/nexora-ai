<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#08080f">

  <meta name="description"
        content="Nexora AI — Premium AI assistant for chat, vision, files and image generation.">

  <meta name="robots"
        content="index, follow">

  <meta name="googlebot"
        content="index, follow">

  <!-- Google Search Console Verification -->
  <!-- Replace ONLY the value below with Google's exact verification code -->
  <meta name="google-site-verification"
        content="PASTE-GOOGLE-VERIFICATION-CODE-HERE">

  <meta property="og:title"
        content="Nexora AI">

  <meta property="og:description"
        content="Your premium AI assistant.">

  <meta property="og:type"
        content="website">

  <title>Nexora AI — AI Assistant</title>

  <style>
    :root {
      --bg: #07070c;
      --panel: rgba(18,18,28,.82);
      --panel2: rgba(25,25,38,.92);
      --border: rgba(255,255,255,.09);
      --text: #f7f7fb;
      --muted: #9696a8;
      --accent: #8b5cf6;
      --accent2: #6366f1;
      --danger: #ef4444;
      --shadow: 0 25px 80px rgba(0,0,0,.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(99,102,241,.16),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 90%,
          rgba(139,92,246,.13),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      height: 100%;
      padding: 18px;
      background: rgba(10,10,17,.88);
      border-right: 1px solid var(--border);
      backdrop-filter: blur(24px);

      display: flex;
      flex-direction: column;

      transition:
        transform .25s ease,
        width .25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 5px 22px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;

      display: grid;
      place-items: center;

      font-size: 20px;
      font-weight: 900;

      background:
        linear-gradient(
          135deg,
          #6366f1,
          #8b5cf6,
          #a855f7
        );

      box-shadow:
        0 8px 30px
        rgba(124,58,237,.4);
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
    }

    .new-chat {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 15px;

      color: white;

      background:
        linear-gradient(
          135deg,
          rgba(99,102,241,.2),
          rgba(139,92,246,.12)
        );

      transition: .2s;
    }

    .new-chat:hover {
      transform: translateY(-1px);
      border-color: rgba(139,92,246,.45);
    }

    .history-title {
      color: var(--muted);
      font-size: 12px;
      margin: 24px 6px 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .history {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 5px;

      color: #ddd;
      background: transparent;
      border: 0;
      border-radius: 10px;

      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: rgba(255,255,255,.06);
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding-top: 15px;
      color: var(--muted);
      font-size: 12px;
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 70px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 22px;

      border-bottom: 1px solid var(--border);
      background: rgba(8,8,14,.65);
      backdrop-filter: blur(20px);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-btn {
      display: none;
    }

    .model {
      color: #ddd;
      font-size: 14px;
      font-weight: 700;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 7px;

      color: #a9a9b9;
      font-size: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow:
        0 0 12px #22c55e;
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px 18px 160px;
      scroll-behavior: smooth;
    }

    .messages {
      width: min(900px, 100%);
      margin: auto;
    }

    .welcome {
      min-height: 65vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      padding: 30px;
    }

    .welcome-logo {
      width: 78px;
      height: 78px;

      border-radius: 25px;

      display: grid;
      place-items: center;

      font-size: 35px;
      font-weight: 900;

      background:
        linear-gradient(
          135deg,
          #6366f1,
          #8b5cf6,
          #c084fc
        );

      box-shadow:
        0 20px 60px
        rgba(124,58,237,.35);

      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: clamp(32px, 6vw, 56px);
      line-height: 1.05;
      margin-bottom: 15px;
      letter-spacing: -2px;
    }

    .gradient {
      background:
        linear-gradient(
          90deg,
          #818cf8,
          #c084fc,
          #f0abfc
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome p {
      max-width: 620px;
      color: var(--muted);
      line-height: 1.7;
    }

    .message {
      display: flex;
      gap: 14px;
      margin-bottom: 25px;
      animation: appear .18s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: 36px;
      height: 36px;
      min-width: 36px;

      border-radius: 12px;

      display: grid;
      place-items: center;

      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);

      font-size: 14px;
      font-weight: 800;
    }

    .message.user .avatar {
      background:
        linear-gradient(
          135deg,
          #6366f1,
          #8b5cf6
        );
    }

    .message-body {
      min-width: 0;
      flex: 1;
    }

    .message-role {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .message-content {
      color: #eeeef4;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-content code {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    }

    .code-block {
      margin: 14px 0;
      padding: 16px;

      background: #050509;
      border: 1px solid var(--border);
      border-radius: 14px;

      overflow-x: auto;
      white-space: pre;
    }

    /* COMPOSER */

    .composer-wrap {
      position: fixed;
      left: 270px;
      right: 0;
      bottom: 0;

      padding:
        20px
        20px
        calc(20px + env(safe-area-inset-bottom));

      background:
        linear-gradient(
          to top,
          rgba(7,7,12,1) 35%,
          rgba(7,7,12,.8),
          transparent
        );

      pointer-events: none;
    }

    .composer {
      width: min(900px, 100%);
      margin: auto;

      padding: 9px;

      display: flex;
      align-items: flex-end;
      gap: 8px;

      background: rgba(22,22,33,.94);
      border: 1px solid var(--border);
      border-radius: 19px;

      box-shadow: var(--shadow);

      pointer-events: auto;
      backdrop-filter: blur(20px);
    }

    .tool {
      width: 43px;
      height: 43px;
      flex-shrink: 0;

      border: 0;
      border-radius: 12px;

      color: #aaaabd;
      background: transparent;

      display: grid;
      place-items: center;

      font-size: 19px;
    }

    .tool:hover {
      background: rgba(255,255,255,.07);
      color: white;
    }

    #messageInput {
      flex: 1;

      min-height: 43px;
      max-height: 180px;

      resize: none;

      padding: 11px 5px;

      color: white;
      background: transparent;
      border: 0;
      outline: 0;

      line-height: 1.45;
    }

    #messageInput::placeholder {
      color: #777789;
    }

    .send {
      width: 43px;
      height: 43px;

      border: 0;
      border-radius: 13px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #6366f1,
          #8b5cf6
        );

      display: grid;
      place-items: center;

      font-size: 18px;

      transition: .2s;
    }

    .send:hover {
      transform: scale(1.04);
    }

    .send:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .file-preview {
      width: min(900px, 100%);
      margin: 0 auto 8px;

      padding: 10px 14px;

      display: none;
      align-items: center;
      justify-content: space-between;

      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(20,20,30,.9);

      pointer-events: auto;
    }

    .file-preview.show {
      display: flex;
    }

    .file-name {
      color: #ccc;
      font-size: 13px;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .remove-file {
      border: 0;
      background: transparent;
      color: #999;
      font-size: 18px;
    }

    .image-result {
      max-width: 100%;
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 7px 0;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aaa;
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
        opacity: .4;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    .error {
      color: #fca5a5;
    }

    .download-btn {
      margin-top: 10px;
      padding: 9px 13px;

      color: white;
      background: rgba(255,255,255,.08);

      border: 1px solid var(--border);
      border-radius: 10px;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .sidebar {
        position: fixed;
        z-index: 50;
        left: 0;
        top: 0;
        bottom: 0;

        transform: translateX(-100%);
        box-shadow: var(--shadow);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-btn {
        display: grid;
      }

      .composer-wrap {
        left: 0;
        padding-left: 10px;
        padding-right: 10px;
      }

      .chat {
        padding-top: 20px;
      }

      .topbar {
        padding: 0 12px;
      }

      .welcome {
        min-height: 60vh;
      }

      .welcome h1 {
        letter-spacing: -1px;
      }
    }

    @media (max-width: 500px) {
      .composer {
        border-radius: 16px;
      }

      .tool {
        width: 38px;
        height: 38px;
      }

      .send {
        width: 38px;
        height: 38px;
      }

      .message {
        gap: 9px;
      }

      .avatar {
        width: 32px;
        height: 32px;
        min-width: 32px;
      }
    }

    #fileInput,
    #imageInput {
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">N</div>

      <div class="brand-name">
        Nexora AI
      </div>
    </div>

    <button
      class="new-chat"
      id="newChat">
      ＋ New Chat
    </button>

    <div class="history-title">
      Conversations
    </div>

    <div
      class="history"
      id="history">
    </div>

    <div class="sidebar-footer">
      Nexora AI
      <br>
      Premium AI Assistant
    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button
          class="tool menu-btn"
          id="menuBtn">
          ☰
        </button>

        <div class="model">
          Nexora AI
        </div>

        <div class="online">
          <span class="dot"></span>
          Online
        </div>

      </div>

    </header>


    <!-- CHAT -->

    <section
      class="chat"
      id="chat">

      <div
        class="messages"
        id="messages">

        <div
          class="welcome"
          id="welcome">

          <div class="welcome-logo">
            N
          </div>

          <h1>
            Welcome to
            <span class="gradient">
              Nexora AI
            </span>
          </h1>

          <p>
            Ask questions, analyze images and
            documents, write code, learn concepts,
            or generate images.
          </p>

        </div>

      </div>

    </section>


    <!-- COMPOSER -->

    <div class="composer-wrap">

      <div
        class="file-preview"
        id="filePreview">

        <span
          class="file-name"
          id="fileName">
        </span>

        <button
          class="remove-file"
          id="removeFile">
          ×
        </button>

      </div>

      <div class="composer">

        <button
          class="tool"
          id="attachBtn"
          title="Upload file">
          ＋
        </button>

        <button
          class="tool"
          id="imageBtn"
          title="Generate image">
          ◇
        </button>

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message Nexora AI..."
          autocomplete="off">
        </textarea>

        <button
          class="send"
          id="sendBtn"
          title="Send">
          ➤
        </button>

      </div>

    </div>

  </main>

</div>


<input
  type="file"
  id="fileInput"
  accept=".txt,.csv,.json,.html,.css,.js,.xml,.pdf,image/*">

<input
  type="file"
  id="imageInput"
  accept="image/*">


<script>
  /* =====================================================
     NEXORA AI FRONTEND
  ===================================================== */

  const input =
    document.getElementById(
      "messageInput"
    );

  const sendBtn =
    document.getElementById(
      "sendBtn"
    );

  const messages =
    document.getElementById(
      "messages"
    );

  const chat =
    document.getElementById(
      "chat"
    );

  const historyEl =
    document.getElementById(
      "history"
    );

  const fileInput =
    document.getElementById(
      "fileInput"
    );

  const imageInput =
    document.getElementById(
      "imageInput"
    );

  const attachBtn =
    document.getElementById(
      "attachBtn"
    );

  const imageBtn =
    document.getElementById(
      "imageBtn"
    );

  const filePreview =
    document.getElementById(
      "filePreview"
    );

  const fileNameEl =
    document.getElementById(
      "fileName"
    );

  const removeFileBtn =
    document.getElementById(
      "removeFile"
    );

  const newChatBtn =
    document.getElementById(
      "newChat"
    );

  const menuBtn =
    document.getElementById(
      "menuBtn"
    );

  const sidebar =
    document.getElementById(
      "sidebar"
    );


  let conversation = [];
  let chats = [];
  let currentChat = null;

  let selectedFile = null;
  let selectedImage = null;

  let imageMode = false;
  let sending = false;


  /* =====================================================
     STORAGE
  ===================================================== */

  try {
    chats =
      JSON.parse(
        localStorage.getItem(
          "nexora_chats"
        ) || "[]"
      );
  } catch {
    chats = [];
  }

  renderHistory();


  function saveChats() {
    try {
      localStorage.setItem(
        "nexora_chats",
        JSON.stringify(chats)
      );
    } catch {}
  }


  /* =====================================================
     NEW CHAT
  ===================================================== */

  newChatBtn.addEventListener(
    "click",
    newChat
  );


  function newChat() {
    conversation = [];
    currentChat = null;

    messages.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-logo">N</div>

        <h1>
          Welcome to
          <span class="gradient">
            Nexora AI
          </span>
        </h1>

        <p>
          Ask questions, analyze images and
          documents, write code, learn concepts,
          or generate images.
        </p>
      </div>
    `;

    removeFile();

    input.value = "";
    imageMode = false;

    input.placeholder =
      "Message Nexora AI...";

    input.focus();
  }


  /* =====================================================
     SIDEBAR
  ===================================================== */

  menuBtn.addEventListener(
    "click",
    () => {
      sidebar.classList.toggle(
        "open"
      );
    }
  );


  /* =====================================================
     FILE
  ===================================================== */

  attachBtn.addEventListener(
    "click",
    () => {
      fileInput.click();
    }
  );


  fileInput.addEventListener(
    "change",
    async () => {
      const file =
        fileInput.files?.[0];

      if (!file) return;

      selectedFile = file;
      selectedImage = null;

      fileNameEl.textContent =
        file.name;

      filePreview.classList.add(
        "show"
      );

      if (
        file.type.startsWith(
          "image/"
        )
      ) {
        selectedImage =
          await fileToBase64(file);
      }
    }
  );


  removeFileBtn.addEventListener(
    "click",
    removeFile
  );


  function removeFile() {
    selectedFile = null;
    selectedImage = null;

    fileInput.value = "";
    imageInput.value = "";

    filePreview.classList.remove(
      "show"
    );

    fileNameEl.textContent = "";
  }


  /* =====================================================
     IMAGE BUTTON
  ===================================================== */

  imageBtn.addEventListener(
    "click",
    () => {
      imageMode = !imageMode;

      input.placeholder =
        imageMode
          ? "Describe the image you want..."
          : "Message Nexora AI...";

      input.focus();
    }
  );


  /* =====================================================
     ENTER
  ===================================================== */

  input.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();

        sendMessage();
      }
    }
  );


  input.addEventListener(
    "input",
    resizeInput
  );


  function resizeInput() {
    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        180
      ) + "px";
  }


  /* =====================================================
     SEND
  ===================================================== */

  sendBtn.addEventListener(
    "click",
    sendMessage
  );


  async function sendMessage() {
    if (sending) return;

    const text =
      input.value.trim();

    if (!text) return;


    if (imageMode) {
      await generateImage(text);
      return;
    }


    sending = true;
    sendBtn.disabled = true;


    const welcome =
      document.getElementById(
        "welcome"
      );

    if (welcome) {
      welcome.remove();
    }


    if (!currentChat) {
      currentChat =
        Date.now().toString();

      chats.unshift({
        id: currentChat,
        title:
          text.slice(0, 60),
        messages: [],
        updated: Date.now()
      });
    }


    addMessage(
      "user",
      text
    );


    conversation.push({
      role: "user",
      content: text
    });


    const active =
      chats.find(
        c =>
          c.id ===
          currentChat
      );

    if (active) {
      active.messages.push({
        role: "user",
        content: text
      });

      active.updated =
        Date.now();
    }


    input.value = "";
    resizeInput();


    const assistant =
      addMessage(
        "assistant",
        ""
      );


    assistant.content.innerHTML =
      `
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;


    scrollBottom();


    try {

      let payload = {
        message: text,

        history:
          conversation
            .slice(-20)
            .map(item => ({
              role:
                item.role,
              content:
                item.content
            }))
      };


      if (selectedFile) {

        const encoded =
          await fileToBase64(
            selectedFile
          );

        payload.file = {
          name:
            selectedFile.name,

          mimeType:
            selectedFile.type ||
            "application/octet-stream",

          data:
            encoded.data
        };
      }


      const response =
        await fetch(
          "/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );


      const raw =
        await response.text();


      let data;

      try {
        data =
          JSON.parse(raw);
      } catch {
        throw new Error(
          "Nexora server returned an invalid response."
        );
      }


      if (!response.ok) {
        throw new Error(
          data?.error ||
          `Server error ${response.status}`
        );
      }


      if (!data?.success) {
        throw new Error(
          data?.error ||
          "Nexora AI failed to respond."
        );
      }


      const answer =
        String(
          data?.answer ||
          data?.text ||
          ""
        ).trim();


      if (!answer) {
        throw new Error(
          "Nexora AI returned an empty response."
        );
      }


      renderAnswer(
        assistant.content,
        answer
      );


      conversation.push({
        role: "assistant",
        content: answer
      });


      if (active) {
        active.messages.push({
          role: "assistant",
          content: answer
        });

        active.updated =
          Date.now();
      }


      saveChats();
      renderHistory();

      removeFile();

    } catch (error) {

      assistant.content.innerHTML =
        `<span class="error">
          ${escapeHtml(
            error?.message ||
            "Sorry, something went wrong."
          )}
        </span>`;

    } finally {

      sending = false;
      sendBtn.disabled = false;

      input.focus();

      scrollBottom();
    }
  }


  /* =====================================================
     ADD MESSAGE
  ===================================================== */

  function addMessage(
    role,
    text
  ) {

    const wrapper =
      document.createElement(
        "div"
      );

    wrapper.className =
      `message ${role}`;

    const avatar =
      document.createElement(
        "div"
      );

    avatar.className =
      "avatar";

    avatar.textContent =
      role === "user"
        ? "U"
        : "N";


    const body =
      document.createElement(
        "div"
      );

    body.className =
      "message-body";


    const roleLabel =
      document.createElement(
        "div"
      );

    roleLabel.className =
      "message-role";

    roleLabel.textContent =
      role === "user"
        ? "You"
        : "Nexora AI";


    const content =
      document.createElement(
        "div"
      );

    content.className =
      "message-content";

    content.textContent =
      text || "";


    body.appendChild(
      roleLabel
    );

    body.appendChild(
      content
    );

    wrapper.appendChild(
      avatar
    );

    wrapper.appendChild(
      body
    );

    messages.appendChild(
      wrapper
    );


    return {
      wrapper,
      content
    };
  }


  /* =====================================================
     MARKDOWN-LIKE RENDER
  ===================================================== */

  function renderAnswer(
    element,
    text
  ) {

    element.innerHTML = "";

    const parts =
      text.split(
        /```([\s\S]*?)```/g
      );


    for (
      let i = 0;
      i < parts.length;
      i++
    ) {

      if (i % 2 === 1) {

        const pre =
          document.createElement(
            "pre"
          );

        pre.className =
          "code-block";

        pre.textContent =
          parts[i];

        element.appendChild(
          pre
        );

      } else {

        const div =
          document.createElement(
            "div"
          );

        div.textContent =
          parts[i];

        element.appendChild(
          div
        );
      }
    }
  }


  /* =====================================================
     IMAGE GENERATION
  ===================================================== */

  async function generateImage(
    prompt
  ) {

    if (sending) return;

    sending = true;
    sendBtn.disabled = true;


    const welcome =
      document.getElementById(
        "welcome"
      );

    if (welcome) {
      welcome.remove();
    }


    addMessage(
      "user",
      prompt
    );


    const assistant =
      addMessage(
        "assistant",
        ""
      );


    assistant.content.innerHTML =
      `
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;


    input.value = "";


    try {

      const response =
        await fetch(
          "/api/generate-image",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                prompt,
                aspectRatio:
                  "1:1",
                imageSize:
                  "1K"
              })
          }
        );


      const raw =
        await response.text();


      let data;

      try {
        data =
          JSON.parse(raw);
      } catch {
        throw new Error(
          "Image API returned invalid response."
        );
      }


      if (!response.ok) {
        throw new Error(
          data?.error ||
          `Image API error ${response.status}`
        );
      }


      if (!data?.success) {
        throw new Error(
          data?.error ||
          "Image generation failed."
        );
      }


      const imageUrl =
        data?.imageUrl ||
        data?.image;


      if (!imageUrl) {
        throw new Error(
          "No image was returned."
        );
      }


      assistant.content.innerHTML = "";


      const img =
        document.createElement(
          "img"
        );

      img.className =
        "image-result";

      img.src =
        imageUrl;

      img.alt =
        prompt;


      assistant.content.appendChild(
        img
      );


      const download =
        document.createElement(
          "button"
        );

      download.className =
        "download-btn";

      download.textContent =
        "Save Image";


      download.onclick =
        () => {

          const a =
            document.createElement(
              "a"
            );

          a.href =
            imageUrl;

          a.download =
            "nexora-ai-image.png";

          a.click();
        };


      assistant.content.appendChild(
        download
      );


    } catch (error) {

      assistant.content.innerHTML =
        `<span class="error">
          ${escapeHtml(
            error?.message ||
            "Image generation failed."
          )}
        </span>`;

    } finally {

      sending = false;
      sendBtn.disabled = false;

      imageMode = false;

      input.placeholder =
        "Message Nexora AI...";

      input.focus();

      scrollBottom();
    }
  }


  /* =====================================================
     HISTORY
  ===================================================== */

  function renderHistory() {

    historyEl.innerHTML = "";

    chats.forEach(
      chatItem => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "history-item";

        button.textContent =
          chatItem.title ||
          "New Chat";


        button.onclick =
          () => loadChat(
            chatItem.id
          );


        historyEl.appendChild(
          button
        );
      }
    );
  }


  function loadChat(id) {

    const item =
      chats.find(
        c =>
          c.id === id
      );

    if (!item) return;

    currentChat =
      id;

    conversation =
      item.messages.map(
        message => ({
          role:
            message.role,
          content:
            message.content
        })
      );


    messages.innerHTML =
      "";


    conversation.forEach(
      message => {

        const result =
          addMessage(
            message.role,
            message.content
          );

        if (
          message.role ===
          "assistant"
        ) {
          renderAnswer(
            result.content,
            message.content
          );
        }
      }
    );


    scrollBottom();


    if (
      window.innerWidth <= 800
    ) {
      sidebar.classList.remove(
        "open"
      );
    }
  }


  /* =====================================================
     FILE BASE64
  ===================================================== */

  function fileToBase64(
    file
  ) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();


        reader.onload =
          () => {

            const result =
              String(
                reader.result
              );

            const comma =
              result.indexOf(
                ","
              );

            resolve({
              data:
                comma >= 0
                  ? result.slice(
                      comma + 1
                    )
                  : result,

              mimeType:
                file.type ||
                "application/octet-stream"
            });
          };


        reader.onerror =
          reject;


        reader.readAsDataURL(
          file
        );
      }
    );
  }


  /* =====================================================
     ESCAPE
  ===================================================== */

  function escapeHtml(
    value
  ) {

    return String(value)
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );
  }


  /* =====================================================
     SCROLL
  ===================================================== */

  function scrollBottom() {

    requestAnimationFrame(
      () => {
        chat.scrollTop =
          chat.scrollHeight;
      }
    );
  }
</script>

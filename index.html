<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>Nexora AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#08090d;
  --panel:#0e1015;
  --card:#14171e;
  --card2:#1a1e26;
  --border:#292f3a;
  --text:#f8fafc;
  --muted:#929baa;
  --accent:#8b5cf6;
  --accent2:#06b6d4;
  --danger:#ff6474;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}

body.light{
  --bg:#ffffff;
  --panel:#f7f7f8;
  --card:#ffffff;
  --card2:#f0f1f3;
  --border:#dedfe3;
  --text:#111318;
  --muted:#626975;
  --shadow:0 15px 45px rgba(0,0,0,.08);
}

html,body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  transition:
    background .25s,
    color .25s;
}

/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:280px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  z-index:100;
  transition:.25s;
}

.brand{
  height:68px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 17px;
}

.logo{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  color:white;
  font-weight:900;
  background:
    linear-gradient(135deg,
    var(--accent),
    var(--accent2));
  box-shadow:
    0 0 30px rgba(139,92,246,.25);
}

.brand-name{
  font-size:19px;
  font-weight:800;
}

.brand-name span{
  background:
    linear-gradient(90deg,
    #a78bfa,
    #22d3ee);
  -webkit-background-clip:text;
  color:transparent;
}

.new-chat{
  margin:0 13px 10px;
  height:44px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  font-weight:650;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 13px;
}

.new-chat:hover{
  background:var(--card2);
}

.search-box{
  padding:4px 13px 12px;
}

.search{
  width:100%;
  height:38px;
  border:1px solid transparent;
  border-radius:9px;
  outline:none;
  padding:0 11px;
  background:var(--card);
  color:var(--text);
}

.search:focus{
  border-color:var(--border);
}

.history-title{
  padding:8px 17px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}

.history{
  flex:1;
  overflow:auto;
  padding:0 8px;
}

.history::-webkit-scrollbar{
  width:4px;
}

.history::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:20px;
}

.chat{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  border:0;
  border-radius:9px;
  padding:10px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  text-align:left;
}

.chat:hover,
.chat.active{
  background:var(--card2);
  color:var(--text);
}

.chat-title{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
}

.chat-more{
  opacity:0;
  font-size:15px;
}

.chat:hover .chat-more{
  opacity:1;
}

.footer{
  border-top:1px solid var(--border);
  padding:9px;
}

.footer-btn{
  width:100%;
  padding:10px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  text-align:left;
}

.footer-btn:hover{
  background:var(--card2);
  color:var(--text);
}

/* ================= MAIN ================= */

.main{
  position:absolute;
  left:280px;
  right:0;
  top:0;
  bottom:0;
  display:flex;
  flex-direction:column;
}

.header{
  height:64px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  background:color-mix(
    in srgb,
    var(--bg) 82%,
    transparent
  );
  backdrop-filter:blur(18px);
  z-index:20;
}

.menu{
  display:none;
  border:0;
  background:none;
  color:var(--text);
  font-size:22px;
  margin-right:12px;
}

.model-button{
  display:flex;
  align-items:center;
  gap:8px;
  border:0;
  background:none;
  color:var(--text);
  cursor:pointer;
  font-weight:750;
}

.online{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#4ade80;
  box-shadow:0 0 12px #4ade80;
}

.header-space{
  flex:1;
}

.icon-button{
  width:36px;
  height:36px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:17px;
}

.icon-button:hover{
  background:var(--card2);
  color:var(--text);
}

/* ================= CHAT ================= */

.chat-area{
  flex:1;
  overflow:auto;
  scroll-behavior:smooth;
}

.chat-area::-webkit-scrollbar{
  width:6px;
}

.chat-area::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:20px;
}

.welcome{
  min-height:100%;
  max-width:900px;
  margin:auto;
  padding:40px 20px 170px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.welcome-logo{
  width:72px;
  height:72px;
  border-radius:23px;
  display:grid;
  place-items:center;
  color:white;
  font-size:28px;
  font-weight:900;
  background:
    linear-gradient(135deg,
    var(--accent),
    var(--accent2));
  box-shadow:
    0 20px 60px rgba(89,75,255,.25);
}

.welcome h1{
  margin-top:23px;
  font-size:clamp(31px,6vw,52px);
  letter-spacing:-2.5px;
  text-align:center;
}

.welcome p{
  margin-top:9px;
  color:var(--muted);
}

.cards{
  width:100%;
  margin-top:38px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.card{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:17px;
  border-radius:14px;
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  background:var(--card2);
}

.card-title{
  font-weight:750;
  font-size:14px;
}

.card-desc{
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
}

/* ================= MESSAGES ================= */

.messages{
  max-width:900px;
  width:100%;
  margin:auto;
  padding-bottom:160px;
}

.message{
  display:flex;
  gap:14px;
  padding:25px 20px;
  border-bottom:1px solid color-mix(
    in srgb,
    var(--border) 45%,
    transparent
  );
}

.avatar{
  width:36px;
  height:36px;
  flex:0 0 36px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:var(--card2);
  font-size:11px;
  font-weight:800;
}

.assistant .avatar{
  color:white;
  background:
    linear-gradient(135deg,
    var(--accent),
    var(--accent2));
}

.message-body{
  flex:1;
  min-width:0;
}

.message-name{
  color:var(--muted);
  font-size:12px;
  font-weight:750;
  margin-bottom:8px;
}

.message-text{
  font-size:15px;
  line-height:1.78;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.actions{
  display:flex;
  gap:3px;
  margin-top:9px;
}

.action{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:5px 7px;
  border-radius:7px;
  cursor:pointer;
  font-size:12px;
}

.action:hover{
  background:var(--card2);
  color:var(--text);
}

/* ================= COMPOSER ================= */

.composer-zone{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:15px 15px 18px;
  pointer-events:none;
  background:
    linear-gradient(
      to top,
      var(--bg) 62%,
      transparent
    );
}

.composer{
  max-width:900px;
  margin:auto;
  pointer-events:auto;
}

.input-box{
  border:1px solid var(--border);
  background:var(--card);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:8px 9px 8px 12px;
}

textarea{
  width:100%;
  min-height:39px;
  max-height:170px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  line-height:1.5;
  padding:8px 2px;
}

textarea::placeholder{
  color:var(--muted);
}

.input-actions{
  display:flex;
  align-items:center;
  gap:4px;
}

.attach,
.voice{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:17px;
}

.attach:hover,
.voice:hover{
  background:var(--card2);
  color:var(--text);
}

.send{
  margin-left:auto;
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  color:white;
  cursor:pointer;
  font-size:19px;
  font-weight:900;
  background:
    linear-gradient(135deg,
    var(--accent),
    var(--accent2));
}

.send:disabled{
  opacity:.4;
  cursor:wait;
}

.note{
  text-align:center;
  color:var(--muted);
  opacity:.65;
  font-size:10px;
  margin-top:7px;
}

/* ================= MODAL ================= */

.modal-backdrop{
  display:none;
  position:fixed;
  inset:0;
  z-index:300;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(5px);
}

.modal-backdrop.show{
  display:grid;
  place-items:center;
}

.modal{
  width:min(430px,calc(100% - 28px));
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal h2{
  font-size:18px;
}

.close{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:20px;
}

.setting{
  margin-top:18px;
}

.setting label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
}

.select,
.setting-button{
  width:100%;
  height:42px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  padding:0 11px;
  outline:none;
}

.setting-button{
  cursor:pointer;
  text-align:left;
}

.setting-button:hover{
  background:var(--card2);
}

.theme-row{
  display:flex;
  gap:8px;
}

.theme-btn{
  flex:1;
  height:42px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}

.theme-btn:hover{
  background:var(--card2);
}

/* ================= TYPING ================= */

.typing{
  display:flex;
  gap:4px;
  align-items:center;
}

.dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--muted);
  animation:up 1.1s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes up{
  0%,60%,100%{
    transform:translateY(0);
  }
  30%{
    transform:translateY(-4px);
  }
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  transform:translate(-50%,15px);
  background:var(--card2);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 15px;
  border-radius:10px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:500;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= MOBILE ================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(0,0,0,.55);
}

@media(max-width:760px){

  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .overlay.open{
    display:block;
  }

  .main{
    left:0;
  }

  .menu{
    display:block;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .welcome{
    padding-left:15px;
    padding-right:15px;
  }

  .message{
    padding:20px 14px;
  }

  .composer-zone{
    padding-left:8px;
    padding-right:8px;
  }
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar" id="sidebar">

  <div class="brand">
    <div class="logo">N</div>
    <div class="brand-name">
      <span>Nexora</span> AI
    </div>
  </div>

  <button class="new-chat" onclick="newChat()">
    ＋ New chat
  </button>

  <div class="search-box">
    <input
      class="search"
      id="search"
      placeholder="Search chats..."
      oninput="renderHistory()"
    >
  </div>

  <div class="history-title">
    Chats
  </div>

  <div class="history" id="history"></div>

  <div class="footer">
    <button
      class="footer-btn"
      onclick="openSettings()"
    >
      ⚙️ Settings
    </button>
  </div>

</aside>

<div
  class="overlay"
  id="overlay"
  onclick="closeSidebar()"
></div>


<!-- ================= MAIN ================= -->

<main class="main">

  <header class="header">

    <button
      class="menu"
      onclick="openSidebar()"
    >
      ☰
    </button>

    <button
      class="model-button"
      onclick="openSettings()"
    >
      <span class="online"></span>
      <span id="modelName">
        Nexora AI
      </span>
      ▾
    </button>

    <div class="header-space"></div>

    <button
      class="icon-button"
      onclick="toggleTheme()"
      title="Toggle theme"
    >
      <span id="themeIcon">☾</span>
    </button>

    <button
      class="icon-button"
      onclick="openSettings()"
      title="Settings"
    >
      ⚙
    </button>

  </header>


  <div class="chat-area" id="chatArea">

    <section
      class="welcome"
      id="welcome"
    >

      <div class="welcome-logo">
        N
      </div>

      <h1>
        What can I help with?
      </h1>

      <p>
        Your intelligent assistant — Nexora AI
      </p>


      <div class="cards">

        <button
          class="card"
          onclick="suggest('Explain photosynthesis in simple words')"
        >
          <div class="card-title">
            📚 Learn
          </div>
          <div class="card-desc">
            Understand difficult topics easily
          </div>
        </button>

        <button
          class="card"
          onclick="suggest('Give me creative ideas for my website')"
        >
          <div class="card-title">
            💡 Brainstorm
          </div>
          <div class="card-desc">
            Generate useful creative ideas
          </div>
        </button>

        <button
          class="card"
          onclick="suggest('Write a professional introduction for my project')"
        >
          <div class="card-title">
            ✍️ Write
          </div>
          <div class="card-desc">
            Create and improve your writing
          </div>
        </button>

        <button
          class="card"
          onclick="suggest('Explain how artificial intelligence works')"
        >
          <div class="card-title">
            🤖 Explore
          </div>
          <div class="card-desc">
            Learn about AI and technology
          </div>
        </button>

      </div>

    </section>


    <div
      class="messages"
      id="messages"
    ></div>

  </div>


  <!-- ================= COMPOSER ================= -->

  <div class="composer-zone">

    <form
      class="composer"
      id="composer"
    >

      <div class="input-box">

        <textarea
          id="message"
          placeholder="Message Nexora AI..."
          rows="1"
        ></textarea>


        <div class="input-actions">

          <button
            type="button"
            class="attach"
            onclick="document.getElementById('file').click()"
            title="Attach file"
          >
            ＋
          </button>

          <input
            id="file"
            type="file"
            accept="image/*,.pdf,.txt,.doc,.docx"
            hidden
            onchange="fileSelected(this)"
          >


          <button
            type="button"
            class="voice"
            onclick="startVoice()"
            title="Voice input"
          >
            🎙
          </button>


          <button
            type="submit"
            class="send"
            id="send"
          >
            ↑
          </button>

        </div>

      </div>

      <div class="note">
        Nexora AI can make mistakes. Check important information.
      </div>

    </form>

  </div>

</main>


<!-- ================= SETTINGS ================= -->

<div
  class="modal-backdrop"
  id="settingsModal"
  onclick="closeSettings(event)"
>

  <div
    class="modal"
    onclick="event.stopPropagation()"
  >

    <div class="modal-head">

      <h2>
        Nexora Settings
      </h2>

      <button
        class="close"
        onclick="closeSettings()"
      >
        ×
      </button>

    </div>


    <div class="setting">

      <label>
        Appearance
      </label>

      <div class="theme-row">

        <button
          class="theme-btn"
          onclick="setTheme('light')"
        >
          ☀ Light
        </button>

        <button
          class="theme-btn"
          onclick="setTheme('dark')"
        >
          ☾ Dark
        </button>

      </div>

    </div>


    <div class="setting">

      <label>
        AI Model
      </label>

      <select
        class="select"
        id="modelSelect"
        onchange="changeModel()"
      >
        <option value="gemini-3.6-flash">
          Gemini 3.6 Flash
        </option>
      </select>

    </div>


    <div class="setting">

      <label>
        Conversations
      </label>

      <button
        class="setting-button"
        onclick="clearAllChats()"
      >
        🗑 Delete all chat history
      </button>

    </div>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =====================================================
   STATE
===================================================== */

let chats = [];

let currentChat = null;

let conversation = [];

let selectedFile = null;

let model =
  localStorage.getItem(
    "nexora_model"
  ) ||
  "gemini-3.6-flash";


/* =====================================================
   ELEMENTS
===================================================== */

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const historyBox =
  document.getElementById("history");

const welcome =
  document.getElementById("welcome");

const messages =
  document.getElementById("messages");

const chatArea =
  document.getElementById("chatArea");

const input =
  document.getElementById("message");

const send =
  document.getElementById("send");


/* =====================================================
   THEME
===================================================== */

function loadTheme(){

  const saved =
    localStorage.getItem(
      "nexora_theme"
    ) || "dark";

  setTheme(saved);

}


function setTheme(theme){

  document.body.classList.toggle(
    "light",
    theme === "light"
  );

  localStorage.setItem(
    "nexora_theme",
    theme
  );

  document.getElementById(
    "themeIcon"
  ).textContent =
    theme === "light"
      ? "☀"
      : "☾";

}


function toggleTheme(){

  setTheme(
    document.body.classList.contains(
      "light"
    )
      ? "dark"
      : "light"
  );

}


/* =====================================================
   STORAGE
===================================================== */

function loadChats(){

  try{

    chats =
      JSON.parse(
        localStorage.getItem(
          "nexora_chats"
        ) || "[]"
      );

  }catch{

    chats = [];

  }

  renderHistory();

}


function saveChats(){

  localStorage.setItem(
    "nexora_chats",
    JSON.stringify(chats)
  );

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  currentChat = null;

  conversation = [];

  messages.innerHTML = "";

  messages.style.display =
    "none";

  welcome.style.display =
    "flex";

  input.value = "";

  selectedFile = null;

  closeSidebar();

  resize();

  input.focus();

  renderHistory();

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  role,
  text
){

  welcome.style.display =
    "none";

  messages.style.display =
    "block";


  const article =
    document.createElement(
      "article"
    );

  article.className =
    "message " + role;


  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "avatar";

  avatar.textContent =
    role === "user"
      ? "You"
      : "N";


  const body =
    document.createElement(
      "div"
    );

  body.className =
    "message-body";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "message-name";

  name.textContent =
    role === "user"
      ? "You"
      : "Nexora AI";


  const textElement =
    document.createElement(
      "div"
    );

  textElement.className =
    "message-text";

  textElement.textContent =
    text;


  body.appendChild(name);

  body.appendChild(
    textElement
  );


  if(role === "assistant"){

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "actions";


    const copy =
      document.createElement(
        "button"
      );

    copy.className =
      "action";

    copy.textContent =
      "Copy";

    copy.onclick =
      () => copyText(text);


    const like =
      document.createElement(
        "button"
      );

    like.className =
      "action";

    like.textContent =
      "👍";

    like.onclick =
      () => toast(
        "Feedback received"
      );


    const dislike =
      document.createElement(
        "button"
      );

    dislike.className =
      "action";

    dislike.textContent =
      "👎";

    dislike.onclick =
      () => toast(
        "Feedback received"
      );


    actions.appendChild(copy);
    actions.appendChild(like);
    actions.appendChild(dislike);

    body.appendChild(actions);

  }


  article.appendChild(avatar);

  article.appendChild(body);

  messages.appendChild(article);

  scrollBottom();

}


/* =====================================================
   SEND
===================================================== */

async function sendMessage(){

  const text =
    input.value.trim();


  if(
    !text ||
    send.disabled
  ){

    return;

  }


  if(!currentChat){

    currentChat =
      Date.now().toString();

    chats.unshift({
      id:currentChat,
      title:text.slice(0,50),
      messages:[],
      updated:Date.now()
    });

  }


  addMessage(
    "user",
    text
  );


  conversation.push({
    role:"user",
    content:text
  });


  const active =
    chats.find(
      c => c.id === currentChat
    );


  if(active){

    active.messages.push({
      role:"user",
      content:text
    });

    active.updated =
      Date.now();

  }


  input.value = "";

  resize();

  send.disabled = true;


  const typing =
    document.createElement(
      "article"
    );

  typing.className =
    "message assistant";


  typing.innerHTML = `
    <div class="avatar">N</div>

    <div class="message-body">

      <div class="message-name">
        Nexora AI
      </div>

      <div class="typing">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

    </div>
  `;


  messages.appendChild(
    typing
  );

  scrollBottom();


  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:text,

            history:
              conversation.slice(-12),

            model:model

          })

        }
      );


    const data =
      await response.json();


    typing.remove();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "Unable to get response"
      );

    }


    addMessage(
      "assistant",
      data.answer
    );


    conversation.push({
      role:"assistant",
      content:data.answer
    });


    if(active){

      active.messages.push({
        role:"assistant",
        content:data.answer
      });

      active.updated =
        Date.now();

    }


    saveChats();

    renderHistory();


  }catch(error){

    typing.remove();

    addMessage(
      "assistant",
      "Sorry, I couldn't complete that request.\n\n" +
      error.message
    );

  }finally{

    send.disabled = false;

    input.focus();

  }

}


/* =====================================================
   FILE
===================================================== */

function fileSelected(
  element
){

  const file =
    element.files?.[0];

  if(!file){

    return;

  }

  selectedFile =
    file;

  toast(
    "Attached: " +
    file.name
  );

}


/* =====================================================
   VOICE
===================================================== */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    toast(
      "Voice input is not supported in this browser."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-IN";

  recognition.interimResults =
    false;


  recognition.onstart =
    () => toast(
      "Listening..."
    );


  recognition.onresult =
    event => {

      const result =
        event
          .results?.[0]?.[0]?.transcript;

      if(result){

        input.value +=
          (
            input.value
              ? " "
              : ""
          ) + result;

        resize();

      }

    };


  recognition.onerror =
    () => toast(
      "Voice input failed."
    );


  recognition.start();

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

  historyBox.innerHTML = "";

  const query =
    document.getElementById(
      "search"
    ).value
      .toLowerCase()
      .trim();


  chats
    .filter(chat =>
      !query ||
      chat.title
        .toLowerCase()
        .includes(query)
    )
    .slice(0,50)
    .forEach(chat=>{

      const row =
        document.createElement(
          "button"
        );

      row.className =
        "chat";


      if(
        chat.id === currentChat
      ){

        row.classList.add(
          "active"
        );

      }


      row.innerHTML = `
        <span>💬</span>
        <span class="chat-title"></span>
        <span class="chat-more">•••</span>
      `;


      row
        .querySelector(
          ".chat-title"
        )
        .textContent =
        chat.title;


      row.onclick =
        () => openChat(
          chat.id
        );


      historyBox.appendChild(
        row
      );

    });

}


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(id){

  const chat =
    chats.find(
      c => c.id === id
    );


  if(!chat){

    return;

  }


  currentChat =
    id;


  conversation =
    chat.messages.map(
      m => ({
        role:m.role,
        content:m.content
      })
    );


  messages.innerHTML = "";

  welcome.style.display =
    "none";

  messages.style.display =
    "block";


  chat.messages.forEach(
    message => {

      addMessage(
        message.role,
        message.content
      );

    }
  );


  renderHistory();

  closeSidebar();

}


/* =====================================================
   COPY
===================================================== */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(
      text
    );

    toast(
      "Copied"
    );

  }catch{

    toast(
      "Copy failed"
    );

  }

}


/* =====================================================
   SETTINGS
===================================================== */

function openSettings(){

  document
    .getElementById(
      "settingsModal"
    )
    .classList.add(
      "show"
    );

}


function closeSettings(event){

  if(
    event &&
    event.target !== event.currentTarget
  ){

    return;

  }

  document
    .getElementById(
      "settingsModal"
    )
    .classList.remove(
      "show"
    );

}


function changeModel(){

  model =
    document.getElementById(
      "modelSelect"
    ).value;

  localStorage.setItem(
    "nexora_model",
    model
  );

  document.getElementById(
    "modelName"
  ).textContent =
    "Nexora AI";

  toast(
    "Model selected"
  );

}


/* =====================================================
   CLEAR HISTORY
===================================================== */

function clearAllChats(){

  if(
    !confirm(
      "Delete all Nexora AI chat history?"
    )
  ){

    return;

  }

  chats = [];

  saveChats();

  newChat();

  closeSettings();

  toast(
    "Chat history deleted"
  );

}


/* =====================================================
   SIDEBAR
===================================================== */

function openSidebar(){

  sidebar.classList.add(
    "open"
  );

  overlay.classList.add(
    "open"
  );

}


function closeSidebar(){

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "open"
  );

}


/* =====================================================
   SUGGEST
===================================================== */

function suggest(text){

  input.value =
    text;

  resize();

  input.focus();

}


/* =====================================================
   TEXTAREA
===================================================== */

function resize(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      170
    ) + "px";

}


input.addEventListener(
  "input",
  resize
);


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   FORM
===================================================== */

document
  .getElementById(
    "composer"
  )
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();

      sendMessage();

    }
  );


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function toast(text){

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    text;

  element.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        element.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =====================================================
   INIT
===================================================== */

document.getElementById(
  "modelSelect"
).value =
  model;

loadTheme();

loadChats();

newChat();

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="description" content="Nexora AI - Premium AI Assistant">
<title>Nexora AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#000000;
  --panel:#09090b;
  --surface:#111113;
  --surface2:#1b1b1f;
  --surface3:#242429;
  --border:#29292f;
  --text:#f5f5f7;
  --muted:#9a9aa3;
  --accent:#8b5cf6;
  --accent2:#06b6d4;
  --danger:#ff5f6d;
  --success:#4ade80;
  --shadow:0 25px 80px rgba(0,0,0,.35);
}

body.light{
  --bg:#ffffff;
  --panel:#f7f7f8;
  --surface:#ffffff;
  --surface2:#eeeeef;
  --surface3:#e4e4e7;
  --border:#dedee3;
  --text:#111114;
  --muted:#66666f;
  --shadow:0 25px 70px rgba(0,0,0,.12);
}

html,
body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:280px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  z-index:100;
  transition:.25s ease;
}

.brand{
  height:70px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 16px;
}

.logo{
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border-radius:13px;
  color:#fff;
  font-weight:900;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  box-shadow:
    0 8px 30px rgba(139,92,246,.2);
}

.brand-name{
  font-size:19px;
  font-weight:800;
}

.brand-name span{
  background:
    linear-gradient(
      90deg,
      #a78bfa,
      #22d3ee
    );
  -webkit-background-clip:text;
  color:transparent;
}

.new-chat{
  margin:0 13px 10px;
  height:45px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  font-weight:700;
  text-align:left;
  padding:0 14px;
}

.new-chat:hover{
  background:var(--surface2);
}

.search-wrap{
  padding:0 13px 12px;
}

.search{
  width:100%;
  height:39px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  background:var(--surface);
  color:var(--text);
  padding:0 12px;
}

.history-label{
  padding:5px 17px 8px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}

.history{
  flex:1;
  overflow:auto;
  padding:0 8px;
}

.chat-row{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  border:0;
  border-radius:10px;
  padding:10px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  text-align:left;
}

.chat-row:hover,
.chat-row.active{
  background:var(--surface2);
  color:var(--text);
}

.chat-title{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:13px;
}

.chat-menu{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  opacity:0;
}

.chat-row:hover .chat-menu{
  opacity:1;
}

.sidebar-footer{
  padding:10px;
  border-top:1px solid var(--border);
}

.sidebar-btn{
  width:100%;
  padding:11px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  text-align:left;
}

.sidebar-btn:hover{
  background:var(--surface2);
  color:var(--text);
}

/* =========================
   MAIN
========================= */

.main{
  position:absolute;
  inset:0 0 0 280px;
  display:flex;
  flex-direction:column;
}

.header{
  height:64px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  padding:0 16px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  z-index:20;
}

.menu-btn{
  display:none;
  border:0;
  background:transparent;
  color:var(--text);
  font-size:22px;
  margin-right:10px;
  cursor:pointer;
}

.model-button{
  border:0;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:750;
  cursor:pointer;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--success);
  box-shadow:0 0 12px var(--success);
}

.header-space{
  flex:1;
}

.icon{
  width:39px;
  height:39px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:17px;
}

.icon:hover{
  background:var(--surface2);
  color:var(--text);
}

/* =========================
   CHAT AREA
========================= */

.chat-area{
  flex:1;
  overflow:auto;
  scroll-behavior:smooth;
}

.welcome{
  min-height:100%;
  max-width:940px;
  margin:auto;
  padding:30px 20px 180px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.welcome-logo{
  width:78px;
  height:78px;
  display:grid;
  place-items:center;
  border-radius:25px;
  color:#fff;
  font-size:30px;
  font-weight:900;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  box-shadow:
    0 25px 80px rgba(99,80,255,.24);
}

.welcome h1{
  margin-top:23px;
  font-size:clamp(30px,6vw,52px);
  letter-spacing:-2px;
  text-align:center;
}

.welcome p{
  margin-top:9px;
  color:var(--muted);
}

.cards{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:35px;
}

.card{
  border:1px solid var(--border);
  border-radius:15px;
  padding:18px;
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  text-align:left;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  background:var(--surface2);
}

.card-title{
  font-size:14px;
  font-weight:800;
}

.card-desc{
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
}

/* =========================
   MESSAGES
========================= */

.messages{
  max-width:940px;
  width:100%;
  margin:auto;
  padding-bottom:170px;
}

.message{
  display:flex;
  gap:14px;
  padding:25px 20px;
  border-bottom:1px solid var(--border);
}

.avatar{
  width:37px;
  height:37px;
  flex:0 0 37px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:var(--surface2);
  font-size:10px;
  font-weight:800;
}

.assistant .avatar{
  color:#fff;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
}

.message-body{
  flex:1;
  min-width:0;
}

.message-name{
  color:var(--muted);
  font-size:12px;
  font-weight:750;
  margin-bottom:8px;
}

.message-text{
  font-size:15px;
  line-height:1.75;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-image{
  max-width:min(500px,100%);
  max-height:350px;
  margin-top:10px;
  border-radius:14px;
  border:1px solid var(--border);
  object-fit:contain;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:9px;
}

.action{
  border:0;
  border-radius:8px;
  padding:6px 8px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:12px;
}

.action:hover{
  background:var(--surface2);
  color:var(--text);
}

/* =========================
   COMPOSER
========================= */

.composer-zone{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:14px 14px 17px;
  pointer-events:none;
  background:
    linear-gradient(
      to top,
      var(--bg) 68%,
      transparent
    );
}

.composer{
  max-width:940px;
  margin:auto;
  pointer-events:auto;
}

.input-box{
  border:1px solid var(--border);
  border-radius:19px;
  background:var(--surface);
  padding:8px 9px 8px 13px;
  box-shadow:var(--shadow);
}

textarea{
  width:100%;
  min-height:42px;
  max-height:180px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font:inherit;
  font-size:15px;
  line-height:1.55;
  padding:8px 2px;
}

textarea::placeholder{
  color:var(--muted);
}

.input-actions{
  display:flex;
  align-items:center;
  gap:4px;
}

.attach,
.voice,
.screen-btn,
.code-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:16px;
}

.attach:hover,
.voice:hover,
.screen-btn:hover,
.code-btn:hover{
  background:var(--surface2);
  color:var(--text);
}

.send{
  margin-left:auto;
  width:41px;
  height:41px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );
  cursor:pointer;
  font-size:19px;
  font-weight:900;
}

.send:disabled{
  opacity:.45;
  cursor:wait;
}

.stop-btn{
  display:none;
  margin-left:auto;
  width:41px;
  height:41px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:var(--danger);
  cursor:pointer;
}

.note{
  margin-top:7px;
  text-align:center;
  color:var(--muted);
  font-size:10px;
  opacity:.75;
}

/* =========================
   ATTACHMENT
========================= */

.attachment-preview{
  display:none;
  align-items:center;
  gap:9px;
  margin-bottom:7px;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--surface2);
  color:var(--muted);
  font-size:12px;
}

.attachment-preview.show{
  display:flex;
}

.remove-file{
  margin-left:auto;
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:18px;
}

/* =========================
   SCREEN PANEL
========================= */

.screen-panel{
  position:fixed;
  right:18px;
  bottom:115px;
  width:min(390px,calc(100% - 36px));
  display:none;
  z-index:220;
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  background:var(--panel);
  box-shadow:var(--shadow);
}

.screen-panel.show{
  display:block;
}

.screen-head{
  display:flex;
  align-items:center;
  padding:11px 13px;
  border-bottom:1px solid var(--border);
}

.screen-title{
  flex:1;
  font-weight:750;
  font-size:13px;
}

.screen-video{
  width:100%;
  display:block;
  background:#000;
  max-height:230px;
  object-fit:contain;
}

.screen-actions{
  display:flex;
  gap:7px;
  padding:10px;
}

.screen-action{
  flex:1;
  height:38px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
}

/* =========================
   CODE PREVIEW
========================= */

.code-panel{
  position:fixed;
  inset:7% 7%;
  display:none;
  flex-direction:column;
  z-index:400;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  background:var(--panel);
  box-shadow:var(--shadow);
}

.code-panel.show{
  display:flex;
}

.code-head{
  min-height:54px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 13px;
  border-bottom:1px solid var(--border);
}

.code-head strong{
  flex:1;
}

.code-editor{
  flex:1;
  width:100%;
  resize:none;
  border:0;
  outline:0;
  padding:18px;
  background:#0b0b0d;
  color:#e5e7eb;
  font:13px/1.6
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
}

.code-preview{
  display:none;
  width:100%;
  flex:1;
  border:0;
  background:#fff;
}

.code-preview.show{
  display:block;
}

.code-editor.hide{
  display:none;
}

.code-actions{
  display:flex;
  gap:7px;
  padding:9px;
  border-top:1px solid var(--border);
}

.code-action{
  height:38px;
  padding:0 13px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
}

/* =========================
   SETTINGS
========================= */

.backdrop{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(7px);
  z-index:500;
}

.backdrop.show{
  display:grid;
}

.modal{
  width:min(470px,calc(100% - 28px));
  max-height:85vh;
  overflow:auto;
  padding:21px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--panel);
  box-shadow:var(--shadow);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal h2{
  font-size:19px;
}

.close{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:23px;
}

.setting{
  margin-top:20px;
}

.setting-label{
  display:block;
  margin-bottom:8px;
  color:var(--muted);
  font-size:12px;
}

.select,
.setting-btn{
  width:100%;
  min-height:42px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:0;
  background:var(--surface);
  color:var(--text);
  padding:0 11px;
}

.setting-btn{
  cursor:pointer;
  text-align:left;
}

.theme-row{
  display:flex;
  gap:8px;
}

.theme-btn{
  flex:1;
  height:42px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  transform:translate(-50%,15px);
  opacity:0;
  pointer-events:none;
  z-index:800;
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--surface2);
  color:var(--text);
  font-size:12px;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:90;
}

@media(max-width:760px){

  .sidebar{
    transform:translateX(-100%);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .overlay.open{
    display:block;
  }

  .main{
    left:0;
  }

  .menu-btn{
    display:block;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .message{
    padding:20px 14px;
  }

  .composer-zone{
    padding-left:8px;
    padding-right:8px;
  }

  .code-panel{
    inset:2% 2%;
  }
}
</style>
</head>

<body>

<aside class="sidebar" id="sidebar">

  <div class="brand">
    <div class="logo">N</div>
    <div class="brand-name">
      <span>Nexora</span> AI
    </div>
  </div>

  <button class="new-chat" onclick="newChat()">
    ＋ New chat
  </button>

  <div class="search-wrap">
    <input
      id="search"
      class="search"
      placeholder="Search chats..."
      autocomplete="off"
    >
  </div>

  <div class="history-label">
    Chats
  </div>

  <div class="history" id="history"></div>

  <div class="sidebar-footer">
    <button
      class="sidebar-btn"
      onclick="openSettings()"
    >
      ⚙️ Settings
    </button>
  </div>

</aside>

<div
  class="overlay"
  id="overlay"
  onclick="closeSidebar()"
></div>

<main class="main">

<header class="header">

  <button
    class="menu-btn"
    onclick="openSidebar()"
  >
    ☰
  </button>

  <button
    class="model-button"
    onclick="openSettings()"
  >
    <span class="status-dot"></span>
    <span id="headerModel">
      Nexora AI
    </span>
    ▾
  </button>

  <div class="header-space"></div>

  <button
    class="icon"
    onclick="toggleTheme()"
    title="Theme"
  >
    <span id="themeIcon">☾</span>
  </button>

  <button
    class="icon"
    onclick="openSettings()"
    title="Settings"
  >
    ⚙
  </button>

</header>


<div class="chat-area" id="chatArea">

<section class="welcome" id="welcome">

  <div class="welcome-logo">
    N
  </div>

  <h1>
    What can I help with?
  </h1>

  <p>
    Your intelligent assistant — Nexora AI
  </p>

  <div class="cards">

    <button
      class="card"
      onclick="suggest('Explain photosynthesis in simple words')"
    >
      <div class="card-title">
        📚 Learn
      </div>
      <div class="card-desc">
        Understand difficult topics easily
      </div>
    </button>

    <button
      class="card"
      onclick="suggest('Help me build a modern website')"
    >
      <div class="card-title">
        💡 Create
      </div>
      <div class="card-desc">
        Build ideas, projects and websites
      </div>
    </button>

    <button
      class="card"
      onclick="suggest('Find and explain the bug in this code')"
    >
      <div class="card-title">
        💻 Code
      </div>
      <div class="card-desc">
        Write, debug and improve code
      </div>
    </button>

    <button
      class="card"
      onclick="suggest('Explain artificial intelligence simply')"
    >
      <div class="card-title">
        🤖 Explore
      </div>
      <div class="card-desc">
        Explore AI and technology
      </div>
    </button>

  </div>

</section>

<div
  class="messages"
  id="messages"
></div>

</div>


<div class="composer-zone">

<form
  class="composer"
  id="composer"
>

  <div
    class="attachment-preview"
    id="attachmentPreview"
  >
    <span id="attachmentName"></span>

    <button
      type="button"
      class="remove-file"
      onclick="removeFile()"
    >
      ×
    </button>
  </div>


  <div class="input-box">

    <textarea
      id="message"
      rows="1"
      placeholder="Message Nexora AI..."
    ></textarea>

    <div class="input-actions">

      <button
        type="button"
        class="attach"
        onclick="document.getElementById('file').click()"
        title="Attach file"
      >
        ＋
      </button>

      <input
        id="file"
        type="file"
        hidden
        accept="image/*,.pdf,.txt,.csv,.json,.html,.htm,.css,.js,.docx"
      >

      <button
        type="button"
        class="voice"
        onclick="startVoice()"
        title="Voice input"
      >
        🎙
      </button>

      <button
        type="button"
        class="screen-btn"
        onclick="toggleScreen()"
        title="Live Screen"
      >
        🖥
      </button>

      <button
        type="button"
        class="code-btn"
        onclick="openCodeEditor()"
        title="Coding"
      >
        </ >
      </button>

      <button
        type="submit"
        class="send"
        id="send"
      >
        ↑
      </button>

      <button
        type="button"
        class="stop-btn"
        id="stop"
        onclick="stopGeneration()"
      >
        ■
      </button>

    </div>

  </div>

  <div class="note">
    Nexora AI can make mistakes. Check important information.
  </div>

</form>

</div>

</main>


<!-- SCREEN PANEL -->

<div
  class="screen-panel"
  id="screenPanel"
>

  <div class="screen-head">
    <div class="screen-title">
      🟢 Live Screen
    </div>

    <button
      class="close"
      onclick="stopScreen()"
    >
      ×
    </button>
  </div>

  <video
    id="screenVideo"
    class="screen-video"
    autoplay

<script>

/* =====================================================
   CONFIG
===================================================== */

const API = "/api/chat";

const DEFAULT_MODEL =
  "gemini-3.6-flash";


/* =====================================================
   STATE
===================================================== */

let chats = [];

let currentChat = null;

let conversation = [];

let selectedFile = null;

let selectedImage = null;

let selectedGenericFile = null;

let sending = false;

let abortController = null;

let screenStream = null;

let screenSnapshot = null;


/* =====================================================
   ELEMENTS
===================================================== */

const input =
  document.getElementById("message");

const send =
  document.getElementById("send");

const stop =
  document.getElementById("stop");

const messages =
  document.getElementById("messages");

const welcome =
  document.getElementById("welcome");

const chatArea =
  document.getElementById("chatArea");

const historyBox =
  document.getElementById("history");


/* =====================================================
   THEME
===================================================== */

function setTheme(theme){

  if(theme === "system"){

    const dark =
      window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

    document.body.classList.toggle(
      "light",
      !dark
    );

    localStorage.setItem(
      "nexora_theme",
      "system"
    );

    document.getElementById(
      "themeIcon"
    ).textContent = "◐";

    return;
  }

  document.body.classList.toggle(
    "light",
    theme === "light"
  );

  localStorage.setItem(
    "nexora_theme",
    theme
  );

  document.getElementById(
    "themeIcon"
  ).textContent =
    theme === "light"
      ? "☀"
      : "☾";
}


function toggleTheme(){

  const isLight =
    document.body.classList.contains(
      "light"
    );

  setTheme(
    isLight
      ? "dark"
      : "light"
  );
}


function loadTheme(){

  setTheme(
    localStorage.getItem(
      "nexora_theme"
    ) || "dark"
  );
}


/* =====================================================
   STORAGE
===================================================== */

function loadChats(){

  try{

    chats =
      JSON.parse(
        localStorage.getItem(
          "nexora_chats"
        ) || "[]"
      );

    if(!Array.isArray(chats)){
      chats = [];
    }

  }catch{

    chats = [];

  }

  renderHistory();
}


function saveChats(){

  localStorage.setItem(
    "nexora_chats",
    JSON.stringify(chats)
  );
}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  currentChat = null;

  conversation = [];

  messages.innerHTML = "";

  messages.style.display =
    "none";

  welcome.style.display =
    "flex";

  input.value = "";

  removeFile();

  resizeInput();

  closeSidebar();

  renderHistory();

  input.focus();
}


/* =====================================================
   MESSAGE UI
===================================================== */

function createMessage(
  role,
  text,
  imageData = null
){

  welcome.style.display =
    "none";

  messages.style.display =
    "block";


  const article =
    document.createElement(
      "article"
    );

  article.className =
    "message " + role;


  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "avatar";

  avatar.textContent =
    role === "user"
      ? "You"
      : "N";


  const body =
    document.createElement(
      "div"
    );

  body.className =
    "message-body";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "message-name";

  name.textContent =
    role === "user"
      ? "You"
      : "Nexora AI";


  const textElement =
    document.createElement(
      "div"
    );

  textElement.className =
    "message-text";

  textElement.textContent =
    text || "";


  body.appendChild(name);

  if(imageData){

    const img =
      document.createElement(
        "img"
      );

    img.className =
      "message-image";

    img.src =
      imageData;

    img.alt =
      "Uploaded image";

    body.appendChild(img);
  }

  body.appendChild(
    textElement
  );


  if(role === "assistant"){

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "actions";


    const copy =
      document.createElement(
        "button"
      );

    copy.className =
      "action";

    copy.textContent =
      "Copy";

    copy.onclick =
      () =>
        copyText(
          textElement.textContent
        );


    const regenerate =
      document.createElement(
        "button"
      );

    regenerate.className =
      "action";

    regenerate.textContent =
      "Regenerate";

    regenerate.onclick =
      () => regenerateLast();


    actions.appendChild(copy);

    actions.appendChild(
      regenerate
    );

    body.appendChild(actions);
  }


  article.appendChild(avatar);

  article.appendChild(body);

  messages.appendChild(article);

  scrollBottom();


  return textElement;
}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  if(sending){
    return;
  }


  const text =
    input.value.trim();


  if(
    !text &&
    !selectedImage &&
    !selectedGenericFile
  ){
    return;
  }


  sending = true;

  send.style.display =
    "none";

  stop.style.display =
    "block";


  if(!currentChat){

    currentChat =
      Date.now().toString();

    chats.unshift({

      id:currentChat,

      title:
        (
          text ||
          selectedFile?.name ||
          "New conversation"
        ).slice(0,60),

      messages:[],

      updated:
        Date.now()

    });
  }


  const imageForUI =
    selectedImage
      ? "data:" +
        selectedImage.mimeType +
        ";base64," +
        selectedImage.data
      : null;


  createMessage(
    "user",
    text,
    imageForUI
  );


  conversation.push({
    role:"user",
    content:text
  });


  const active =
    chats.find(
      c => c.id === currentChat
    );


  if(active){

    active.messages.push({
      role:"user",
      content:text
    });

    active.updated =
      Date.now();

    saveChats();
  }


  input.value = "";

  resizeInput();


  const assistantText =
    createMessage(
      "assistant",
      ""
    );


  try{

    const payload = {

      message:
        text ||
        "Please analyze the uploaded content.",

      history:
        conversation.slice(-20),

      model:
        document.getElementById(
          "modelSelect"
        ).value ||
        DEFAULT_MODEL

    };


    if(selectedImage){

      payload.image =
        selectedImage;
    }


    if(selectedGenericFile){

      payload.file =
        selectedGenericFile;
    }


    if(screenSnapshot){

      payload.image =
        screenSnapshot;

      screenSnapshot =
        null;
    }


    removeFile();


    abortController =
      new AbortController();


    const response =
      await fetch(
        API,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            ),

          signal:
            abortController.signal
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();

      let errorMessage =
        "Request failed.";

      try{

        const parsed =
          JSON.parse(
            errorText
          );

        errorMessage =
          parsed.error ||
          errorMessage;

      }catch{}

      throw new Error(
        errorMessage
      );
    }


    if(!response.body){

      throw new Error(
        "Streaming is not supported."
      );
    }


    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder();

    let buffer = "";

    let answer = "";


    while(true){

      const {
        value,
        done
      } =
        await reader.read();


      if(done){
        break;
      }


      buffer +=
        decoder.decode(
          value,
          {
            stream:true
          }
        );


      const lines =
        buffer.split("\n");

      buffer =
        lines.pop() || "";


      for(
        const line of lines
      ){

        const trimmed =
          line.trim();


        if(
          !trimmed ||
          trimmed.startsWith(":")
        ){
          continue;
        }


        if(
          !trimmed.startsWith(
            "data:"
          )
        ){
          continue;
        }


        const raw =
          trimmed
            .slice(5)
            .trim();


        if(
          raw === "[DONE]"
        ){
          continue;
        }


        try{

          const chunk =
            JSON.parse(raw);


          if(chunk.error){

            throw new Error(
              chunk.error
            );
          }


          const parts =
            chunk
              ?.candidates?.[0]
              ?.content?.parts;


          if(
            Array.isArray(parts)
          ){

            for(
              const part of parts
            ){

              if(
                typeof part?.text ===
                "string"
              ){

                answer +=
                  part.text;

                assistantText.textContent =
                  answer;

                scrollBottom();
              }
            }
          }

        }catch(error){

          if(
            error?.message &&
            error.message !==
            "Unexpected end of JSON input"
          ){

            if(
              error.message
                .toLowerCase()
                .includes("api")
            ){

              throw error;
            }
          }
        }
      }
    }


    if(!answer.trim()){

      throw new Error(
        "No response received from Gemini."
      );
    }


    conversation.push({
      role:"assistant",
      content:answer
    });


    if(active){

      active.messages.push({
        role:"assistant",
        content:answer
      });

      active.updated =
        Date.now();

      saveChats();
      renderHistory();
    }


  }catch(error){

    if(
      error?.name ===
      "AbortError"
    ){

      assistantText.textContent =
        "Generation stopped.";

    }else{

      assistantText.textContent =
        "Sorry, something went wrong.\n\n" +
        (
          error?.message ||
          "Unknown error."
        );
    }

  }finally{

    sending = false;

    abortController = null;

    send.style.display =
      "block";

    stop.style.display =
      "none";

    input.focus();
  }
}


/* =====================================================
   STOP GENERATION
===================================================== */

function stopGeneration(){

  if(abortController){

    abortController.abort();

    toast(
      "Generation stopped"
    );
  }
}


/* =====================================================
   REGENERATE
===================================================== */

function regenerateLast(){

  if(sending){
    return;
  }


  if(
    conversation.length < 2
  ){
    return;
  }


  const last =
    conversation[
      conversation.length - 1
    ];


  if(
    last.role === "assistant"
  ){

    conversation.pop();

  }


  const previous =
    conversation[
      conversation.length - 1
    ];


  if(
    previous?.role !== "user"
  ){
    return;
  }


  input.value =
    previous.content;

  sendMessage();
}


/* =====================================================
   FILE UPLOAD
===================================================== */

document
  .getElementById("file")
  .addEventListener(
    "change",
    fileSelected
  );


async function fileSelected(event){

  const file =
    event.target.files?.[0];


  if(!file){
    return;
  }


  selectedFile =
    file;


  document
    .getElementById(
      "attachmentName"
    )
    .textContent =
      "📎 " +
      file.name;


  document
    .getElementById(
      "attachmentPreview"
    )
    .classList.add(
      "show"
    );


  if(
    file.type.startsWith(
      "image/"
    )
  ){

    const base64 =
      await fileToBase64(
        file
      );

    selectedImage = {

      mimeType:
        file.type,

      data:
        stripDataPrefix(
          base64
        )
    };

    selectedGenericFile =
      null;

    return;
  }


  const base64 =
    await fileToBase64(
      file
    );


  selectedImage =
    null;


  selectedGenericFile = {

    name:
      file.name,

    mimeType:
      file.type ||
      getMimeFromName(
        file.name
      ),

    data:
      stripDataPrefix(
        base64
      )
  };


  toast(
    file.name +
    " attached"
  );
}


function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        () =>
          resolve(
            String(
              reader.result
            )
          );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );
    }
  );
}


function stripDataPrefix(
  data
){

  const comma =
    data.indexOf(",");

  return comma >= 0
    ? data.slice(
        comma + 1
      )
    : data;
}


function getMimeFromName(
  name
){

  const ext =
    name
      .toLowerCase()
      .split(".")
      .pop();


  const map = {

    txt:"text/plain",

    csv:"text/csv",

    json:"application/json",

    html:"text/html",

    htm:"text/html",

    css:"text/css",

    js:"application/javascript",

    pdf:"application/pdf",

    docx:
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  };


  return map[ext] ||
    "application/octet-stream";
}


function removeFile(){

  selectedFile = null;

  selectedImage = null;

  selectedGenericFile = null;


  const file =
    document.getElementById(
      "file"
    );

  file.value = "";


  document
    .getElementById(
      "attachmentPreview"
    )
    .classList.remove(
      "show"
    );
}


/* =====================================================
   VOICE
===================================================== */

function startVoice(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!Recognition){

    toast(
      "Voice input is not supported in this browser."
    );

    return;
  }


  const recognition =
    new Recognition();


  recognition.lang =
    "en-IN";

  recognition.interimResults =
    true;

  recognition.continuous =
    false;


  recognition.onstart =
    () =>
      toast(
        "Listening..."
      );


  recognition.onresult =
    event => {

      let text = "";

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        text +=
          event.results[i][0]
            .transcript;
      }


      input.value =
        text;

      resizeInput();
    };


  recognition.onerror =
    () =>
      toast(
        "Voice input failed."
      );


  recognition.onend =
    () =>
      resizeInput();


  try{

    recognition.start();

  }catch{

    toast(
      "Voice input could not start."
    );
  }
}


/* =====================================================
   SCREEN SHARING
===================================================== */

async function toggleScreen(){

  if(screenStream){

    stopScreen();

    return;
  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices
      .getDisplayMedia
  ){

    toast(
      "Screen sharing is not supported here."
    );

    return;
  }


  try{

    screenStream =
      await navigator
        .mediaDevices
        .getDisplayMedia({
          video:true,
          audio:false
        });


    const video =
      document.getElementById(
        "screenVideo"
      );

    video.srcObject =
      screenStream;


    document
      .getElementById(
        "screenPanel"
      )
      .classList.add(
        "show"
      );


    const track =
      screenStream
        .getVideoTracks()[0];


    if(track){

      track.onended =
        () =>
          stopScreen();
    }


    toast(
      "Live screen sharing started"
    );

  }catch(error){

    toast(
      "Screen sharing cancelled."
    );
  }
}


function stopScreen(){

  if(screenStream){

    screenStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );
  }


  screenStream = null;


  const video =
    document.getElementById(
      "screenVideo"
    );


  video.srcObject =
    null;


  document
    .getElementById(
      "screenPanel"
    )
    .classList.remove(
      "show"
    );
}


async function captureScreen(){

  if(!screenStream){

    toast(
      "Start screen sharing first."
    );

    return;
  }


  const video =
    document.getElementById(
      "screenVideo"
    );


  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    toast(
      "Screen is not ready yet."
    );

    return;
  }


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  const dataURL =
    canvas.toDataURL(
      "image/jpeg",
      .82
    );


  screenSnapshot = {

    mimeType:
      "image/jpeg",

    data:
      stripDataPrefix(
        dataURL
      )
  };


  stopScreen();


  input.value =
    input.value ||
    "Analyze this screen and explain what you see.";


  resizeInput();

  input.focus();


  toast(
    "Screen snapshot attached. Send it to Nexora."
  );
}

/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

  historyBox.innerHTML = "";


  const query =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  chats
    .filter(chat =>
      !query ||
      String(chat.title)
        .toLowerCase()
        .includes(query)
    )
    .sort(
      (a,b) =>
        (b.updated || 0) -
        (a.updated || 0)
    )
    .forEach(chat => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "chat-row";


      if(
        chat.id ===
        currentChat
      ){

        row.classList.add(
          "active"
        );
      }


      const icon =
        document.createElement(
          "span"
        );

      icon.textContent =
        "💬";


      const title =
        document.createElement(
          "span"
        );

      title.className =
        "chat-title";

      title.textContent =
        chat.title;


      const menu =
        document.createElement(
          "button"
        );

      menu.className =
        "chat-menu";

      menu.textContent =
        "•••";


      menu.onclick =
        event => {

          event.stopPropagation();

          chatActions(
            chat.id
          );
        };


      row.onclick =
        () =>
          openChat(
            chat.id
          );


      row.appendChild(icon);

      row.appendChild(title);

      row.appendChild(menu);

      historyBox.appendChild(
        row
      );
    });
}


document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    renderHistory
  );


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(id){

  const chat =
    chats.find(
      c => c.id === id
    );


  if(!chat){
    return;
  }


  currentChat =
    id;


  conversation =
    Array.isArray(chat.messages)
      ? chat.messages.map(
          m => ({
            role:m.role,
            content:m.content
          })
        )
      : [];


  messages.innerHTML = "";

  welcome.style.display =
    "none";

  messages.style.display =
    "block";


  chat.messages.forEach(
    message =>
      createMessage(
        message.role,
        message.content
      )
  );


  renderHistory();

  closeSidebar();

  scrollBottom();
}


/* =====================================================
   CHAT ACTIONS
===================================================== */

function chatActions(id){

  const chat =
    chats.find(
      c => c.id === id
    );


  if(!chat){
    return;
  }


  const choice =
    prompt(
      "Type:\nrename = Rename chat\ndelete = Delete chat"
    );


  if(
    choice?.toLowerCase() ===
    "rename"
  ){

    const title =
      prompt(
        "New chat name:",
        chat.title
      );


    if(title?.trim()){

      chat.title =
        title.trim();

      chat.updated =
        Date.now();

      saveChats();

      renderHistory();
    }
  }


  if(
    choice?.toLowerCase() ===
    "delete"
  ){

    chats =
      chats.filter(
        c => c.id !== id
      );


    saveChats();


    if(
      currentChat === id
    ){

      newChat();
    }


    renderHistory();
  }
}


/* =====================================================
   COPY
===================================================== */

async function copyText(text){

  try{

    await navigator
      .clipboard
      .writeText(
        text
      );

    toast(
      "Copied"
    );

  }catch{

    toast(
      "Copy failed"
    );
  }
}


/* =====================================================
   SETTINGS
===================================================== */

function openSettings(){

  document
    .getElementById(
      "settingsModal"
    )
    .classList.add(
      "show"
    );
}


function closeSettings(event){

  if(
    event &&
    event.target !==
    event.currentTarget
  ){

    return;
  }


  document
    .getElementById(
      "settingsModal"
    )
    .classList.remove(
      "show"
    );
}


document
  .getElementById(
    "modelSelect"
  )
  .addEventListener(
    "change",
    event => {

      const model =
        event.target.value;


      document
        .getElementById(
          "headerModel"
        )
        .textContent =
          model
            .replace(
              "gemini-",
              "Gemini "
            );

      localStorage.setItem(
        "nexora_model",
        model
      );

      toast(
        "Model selected"
      );
    }
  );


function loadModel(){

  const saved =
    localStorage.getItem(
      "nexora_model"
    ) ||
    DEFAULT_MODEL;


  document
    .getElementById(
      "modelSelect"
    )
    .value =
      saved;


  document
    .getElementById(
      "headerModel"
    )
    .textContent =
      saved
        .replace(
          "gemini-",
          "Gemini "
        );
}


/* =====================================================
   CLEAR HISTORY
===================================================== */

function clearHistory(){

  if(
    !confirm(
      "Delete all chat history?"
    )
  ){
    return;
  }


  chats = [];

  saveChats();

  newChat();

  closeSettings();

  toast(
    "Chat history deleted"
  );
}


/* =====================================================
   MOBILE SIDEBAR
===================================================== */

function openSidebar(){

  document
    .getElementById(
      "sidebar"
    )
    .classList.add(
      "open"
    );

  document
    .getElementById(
      "overlay"
    )
    .classList.add(
      "open"
    );
}


function closeSidebar(){

  document
    .getElementById(
      "sidebar"
    )
    .classList.remove(
      "open"
    );

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "open"
    );
}


/* =====================================================
   SUGGESTIONS
===================================================== */

function suggest(text){

  input.value =
    text;

  resizeInput();

  input.focus();
}


/* =====================================================
   TEXTAREA
===================================================== */

function resizeInput(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      180
    ) + "px";
}


input.addEventListener(
  "input",
  resizeInput
);


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();
    }
  }
);


/* =====================================================
   FORM
===================================================== */

document
  .getElementById(
    "composer"
  )
  .addEventListener(
    "submit",
    event => {

      event.preventDefault();

      sendMessage();
    }
  );


/* =====================================================
   KEYBOARD SHORTCUTS
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() ===
      "k"
    ){

      event.preventDefault();

      document
        .getElementById(
          "search"
        )
        .focus();
    }


    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() ===
      "n"
    ){

      event.preventDefault();

      newChat();
    }


    if(
      event.key === "Escape"
    ){

      closeSettings();

      closeCodeEditor();

      stopScreen();
    }
  }
);


function showShortcuts(){

  alert(
    "Keyboard Shortcuts\n\n" +
    "Enter — Send message\n" +
    "Shift + Enter — New line\n" +
    "Ctrl/Cmd + K — Search chats\n" +
    "Ctrl/Cmd + N — New chat\n" +
    "Esc — Close panels"
  );
}


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

  chatArea.scrollTop =
    chatArea.scrollHeight;
}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function toast(text){

  const element =
    document.getElementById(
      "toast"
    );


  element.textContent =
    text;


  element.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        element.classList.remove(
          "show"
        );

      },
      2200
    );
}


/* =====================================================
   SYSTEM THEME CHANGE
===================================================== */

window
  .matchMedia(
    "(prefers-color-scheme: dark)"
  )
  .addEventListener(
    "change",
    () => {

      if(
        localStorage.getItem(
          "nexora_theme"
        ) === "system"
      ){

        setTheme(
          "system"
        );
      }
    }
  );


/* =====================================================
   INIT
===================================================== */

loadTheme();

loadChats();

loadModel();

newChat();

</script>
